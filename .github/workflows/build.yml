name: Build
# 机器人触发时 build_id 是随机串,公开页面上看不出是哪个品牌。
run-name: ${{ github.event.client_payload.build_id || format('manual-{0}', github.run_number) }}

on:
  # 打包机器人走这条:POST /repos/{repo}/dispatches,参数在 client_payload 里。
  repository_dispatch:
    types: [build]
  # 手动在 Actions 页面点也能打(签名用仓库 secrets 里的 KEYSTORE_B64)。
  workflow_dispatch:
    inputs:
      app_name:
        description: 应用名
        required: true
      package_name:
        description: 包名(如 com.example.app)
        required: true
      version_name:
        description: 版本号
        default: "1.0.0"
      version_code:
        description: 版本序号(整数,每次发布要比上次大)
        default: "1"
      panel_urls:
        description: 面板地址,多个用逗号分隔
        required: true
      api_prefix:
        description: 接口前缀
        default: /api/v1
      logo_url:
        description: logo 图片链接(可空,用默认图标)
        default: ""
      brand_color:
        description: 品牌色,如 #2F6BFF(可空)
        default: ""
      user_agent:
        description: 自定义 UA(可空;{version} 代表版本号)
        default: ""
      abis:
        description: 打进包的 ABI
        default: arm64-v8a,armeabi-v7a

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取打包脚本
        uses: actions/checkout@v4
        with:
          path: tools
          persist-credentials: false

      # 这是公开仓库,日志登录用户都能看。参数的读取、校验、打码都在 scripts/params.py 里(说明见那个文件):
      # 能认出品牌的值不进 $GITHUB_ENV、不进任何步骤的 env,各步骤用 eval "$(… params.py env …)" 取。
      - name: 读取参数
        run: python3 tools/scripts/params.py init

      - name: 取客户端源码(私有仓库)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          ref: ${{ env.P_SOURCE_REF }}
          path: src
          # 拉完就不留部署密钥,后面的 Gradle / Go / pip 代码读不到它。
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum

      - name: Android NDK
        id: ndk
        # 第三方 action 钉死到具体提交:这个 job 里有品牌签名,不能让别人改个 tag 就换掉代码。
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r27c
          add-to-path: false

      # 内核(官方 mihomo,gomobile 编译)按 core/ 目录内容缓存:源码没动就不用每次重编十几分钟。
      - name: 内核缓存
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: src/app/libs/mihomo.aar
          key: core-r27c-${{ env.P_ABIS_KEY }}-${{ hashFiles('src/core/**') }}

      - name: 编译内核
        if: steps.core-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          GOFLAGS: -buildvcs=false
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          # ABI → gomobile 目标
          TARGETS=$(echo "$P_ABIS" | tr ',' '\n' | sed -e 's/arm64-v8a/android\/arm64/' -e 's/armeabi-v7a/android\/arm/' -e 's/x86_64/android\/amd64/' -e 's/^x86$/android\/386/' | paste -sd, -)
          echo "gomobile targets: $TARGETS"
          TARGETS="$TARGETS" bash src/core/build.sh

      # 编完立刻存:放在 job 末尾的话,后面任何一步失败(logo 坏了、签名不对)这十几分钟就白编了。
      - name: 保存内核缓存
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/app/libs/mihomo.aar
          key: core-r27c-${{ env.P_ABIS_KEY }}-${{ hashFiles('src/core/**') }}

      - name: 品牌图标与颜色
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          eval "$(python3 tools/scripts/params.py env logo_url logo_file_id brand_color)"
          pip3 install -q pillow
          python3 tools/scripts/android_icons.py --res src/app/src/main/res \
            --logo-url "$P_LOGO_URL" --logo-file-id "$P_LOGO_FILE_ID" --brand-color "$P_BRAND_COLOR"

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: 打包
        working-directory: src
        env:
          # 仅手动打包时用:机器人打包每个品牌自带签名。
          REPO_KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          REPO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          REPO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          eval "$(python3 ../tools/scripts/params.py env app_name package_name version_name version_code panel_urls api_prefix \
            config_urls config_xor_key user_agent default_config_b64 abis keystore_file keystore_password key_alias)"
          if [ -n "$P_KEYSTORE_FILE" ]; then
            echo "签名:本次参数里的品牌签名"
          elif [ -n "$REPO_KEYSTORE_B64" ] && [ "$P_BOT" != "1" ]; then
            echo "$REPO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/repo.p12"
            P_KEYSTORE_FILE="$RUNNER_TEMP/repo.p12"; P_KEYSTORE_PASSWORD="$REPO_KEYSTORE_PASSWORD"
            [ -n "$REPO_KEY_ALIAS" ] && P_KEY_ALIAS="$REPO_KEY_ALIAS"
            echo "签名:仓库 secrets"
          elif [ "$P_BOT" = "1" ]; then
            # 机器人打的包一定要用品牌自己的签名;用别的签出来,用户手机上的旧版就再也覆盖不了。
            echo "::error::机器人打包没有带签名,拒绝继续"; exit 1
          else
            echo "::warning::没有签名文件,APK 是 debug 签名,不能用来发布"
          fi
          # 不叫 APP_NAME:gradlew 脚本里有同名变量,会把它覆盖成 "Gradle"。
          export APP_LABEL="$P_APP_NAME" APP_ID="$P_PACKAGE_NAME" VERSION_NAME="$P_VERSION_NAME" VERSION_CODE="$P_VERSION_CODE"
          export PANEL_URLS="$P_PANEL_URLS" API_PREFIX="$P_API_PREFIX" CONFIG_URLS="$P_CONFIG_URLS" CONFIG_XOR_KEY="$P_CONFIG_XOR_KEY"
          export USER_AGENT="$P_USER_AGENT" DEFAULT_CONFIG_B64="$P_DEFAULT_CONFIG_B64" TERN_ABIS="$P_ABIS"
          export KEYSTORE_FILE="$P_KEYSTORE_FILE" storePassword="$P_KEYSTORE_PASSWORD" keyPassword="$P_KEYSTORE_PASSWORD" keyAlias="$P_KEY_ALIAS"
          chmod +x gradlew
          ./gradlew --no-daemon -q :app:assembleRelease
          echo "P_SIGNED=$([ -n "$P_KEYSTORE_FILE" ] && echo 1 || echo 0)" >> "$GITHUB_ENV"

      - name: 核对产物
        run: |
          set -euo pipefail
          eval "$(python3 tools/scripts/params.py env app_name package_name cert_sha256)"
          APK=src/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")
          PKG=$(echo "$BADGING" | grep -o "^package: name='[^']*'" | cut -d"'" -f2)
          [ "$PKG" = "$P_PACKAGE_NAME" ] || { echo "包名不符"; exit 1; }
          LABEL=$(echo "$BADGING" | grep -o "^application-label:'[^']*'" | cut -d"'" -f2)
          [ "$LABEL" = "$P_APP_NAME" ] || { echo "应用名不符"; exit 1; }
          echo "$BADGING" | grep -E "^native-code"
          # 签名:必须验证通过;机器人给了证书指纹的话,必须就是那一把。指纹本身不打印 —— 它每个品牌固定不变,
          # 任何人都能从该品牌的安装包里读到,打出来就等于在公开日志里标明"这个品牌是在这里打的"。
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
          [ -n "$CERT" ] || { echo "读不到签名证书"; exit 1; }
          if [ -n "$P_CERT_SHA256" ]; then
            [ "$CERT" = "$P_CERT_SHA256" ] || { echo "::error::签名证书和品牌的不是同一把"; exit 1; }
            echo "签名核对通过:是这个品牌自己的证书"
          elif [ "$P_SIGNED" = "1" ]; then
            echo "签名验证通过(没有给期望的证书指纹,未比对是哪一把)"
          fi
          mkdir -p dist
          cp "$APK" dist/app.apk   # 文件名不带品牌名;发 Telegram 时再起好看的名字
          du -h dist/app.apk | cut -f1

      - name: 发到 Telegram
        if: always() && env.P_BOT == '1'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/scripts/notify.py

      # 公开仓库的 artifact 登录用户都能下载,所以机器人打的包只发 Telegram、不留在这里;
      # 只有发送失败(超过 Telegram 50MB 上限、网络问题)时才留一份 1 天的,免得白打。手动打包照常留 3 天。
      - name: 上传产物
        if: always() && (env.P_BOT != '1' || env.P_KEEP_ARTIFACT == '1')
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_id }}
          path: dist/app.apk
          if-no-files-found: ignore
          retention-days: ${{ env.P_BOT == '1' && 1 || 3 }}
